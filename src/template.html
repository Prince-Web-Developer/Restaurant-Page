<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <title>Rain Bites</title>
</head>

<body>
    <header>
        <h1>Rain Bites</h1>
        <nav>
            <button id="bar" aria-expanded="false" aria-label="open navbar" aria-controls="navList"><svg
                    xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="#000000">
                    <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" />
                </svg></button>
            <ul id="navList">
                <li class="closeContainer"><button id="closeNav" class="tab smaller-font" aria-controls="navList"
                        aria-label="close navbar"><svg xmlns="http://www.w3.org/2000/svg" height="24px"
                            viewBox="0 -960 960 960" width="24px" fill="#000000">
                            <path
                                d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
                        </svg></button></li>
                <li><button class="tab smaller-font">Home</button></li>
                <li><button class="tab smaller-font">Menu</button></li>
                <li><button class="tab smaller-font">About</button></li>
            </ul>
        </nav>
    </header>
    <main id="content">
        <div id="home" class="section">
            <div class="intro">
                <div class="img-container">
                    <img src="images/image1.jpg" alt="beautiful dinning area near a river" width="280px">
                </div>
                <div class="text-container">
                    <h2 class="gray-text-styling">We Have One Goal</h2>
                    <p>To Make Your Heart Happy 🍪</p>
                </div>
            </div>
            <div class="pageSection intro">
                <div class="pastaImgCon img-container">
                    <img id="pastaImg" src="images/pastaPlate-removebg-preview.png" alt="yummy pasta in a plate"
                        width="280px">
                </div>
                <div class="text-container">
                    <p class="SectionText">Enjoy Tasty Food In The Heart Of Nature</p>
                </div>
            </div>
            <div class="gallerySection">
                <button class="backG galleryBtn"><svg xmlns="http://www.w3.org/2000/svg" height="24px"
                        viewBox="0 -960 960 960" width="24px" fill="#000000">
                        <path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z" />
                    </svg>
                </button>
                <div class="galleryInterface">
                    <div class="gallery">
                        <div class="img1 galleryImgCon" data-img="1"></div>
                        <div class="img2 galleryImgCon" data-img="2"></div>
                        <div class="img3 galleryImgCon" data-img="3"></div>
                        <div class="img4 galleryImgCon" data-img="4"></div>
                    </div>
                    <div class="galleryBtnCon">
                        <button class="galleryBtn" id="firstGall" data-img="1"></button>
                        <button class="galleryBtn" data-img="2"></button>
                        <button class="galleryBtn" data-img="3"></button>
                        <button class="galleryBtn" data-img="4"></button>
                    </div>
                </div>
                <button class="forwardG galleryBtn"><svg  class="forwardG" xmlns="http://www.w3.org/2000/svg" height="24px"
                        viewBox="0 -960 960 960" width="24px" fill="#000000">
                        <path d="m321-80-71-71 329-329-329-329 71-71 400 400L321-80Z" />
                    </svg>
                </button>
            </div>
            <div class="commentSection">
                <h3>Reviews</h3>
                <div class="reviews">
                    <div class="review">
                        <div class="profile">
                            <div class="profile2 profilePic"></div>
                            <div class="name smaller-font">Me</div>
                        </div>
                        <div class="reviewContent">
                            <h4 class="smaller-font">Tired Of making this site</h4>
                        </div>
                    </div>
                    <div class="review">
                        <div class="profile">
                            <div class="profile2 profilePic"></div>
                            <div class="name smaller-font">Sam</div>
                        </div>
                        <div class="reviewContent">
                            <h4 class="smaller-font">Great Atmosphere And Food</h4>
                        </div>
                    </div>
                    <div class="review">
                        <div class="profile">
                            <div class="profile1 profilePic"></div>
                            <div class="name smaller-font">Donald Trump</div>
                        </div>
                        <div class="reviewContent">
                            <h4 class="smaller-font">They Got Best Food 🔥</h4>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </main>
</body>

</html>
